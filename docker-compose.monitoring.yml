# 监控栈：Prometheus + Alertmanager
#
# 只跑监控，不重复起业务容器（业务用仓库根的 docker-compose.yml）：
#   docker compose -f docker-compose.monitoring.yml up -d
#
# 访问：
#   Prometheus   http://localhost:9090
#   Alertmanager http://localhost:9093
#
# 注意：campus-backend 是根 compose 里的服务名，两者需要在同一个网络里；
# 如果分开起，把下面 targets 改成 host.docker.internal:8080。
name: campus-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: campus-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./docs/ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docs/ops/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: campus-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./docs/ops/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  prometheus-data:
  alertmanager-data: