# 监控栈：Prometheus + Alertmanager
#
# 只跑监控，不重复起业务容器（业务用仓库根的 docker-compose.yml）：
#   docker compose -f docker-compose.monitoring.yml up -d
#
# 访问：
#   Prometheus   http://localhost:9090
#   Alertmanager http://localhost:9093
#
# 注意：campus-backend 是根 compose 里的服务名，两者需要在同一个网络里；
# 如果分开起，把下面 targets 改成 host.docker.internal:8080。
name: campus-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: campus-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./docs/ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docs/ops/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: campus-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./docs/ops/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 日志集中化：应用通过 LokiLogAppender 直接 push，不需要 Promtail 抓文件
  loki:
    image: grafana/loki:3.2.1
    container_name: campus-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docs/ops/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.0
    container_name: campus-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
    volumes:
      - ./docs/ops/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - prometheus

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data: