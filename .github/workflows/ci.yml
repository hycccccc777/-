# =====================================================================
# GitHub Actions —— 与 scripts/ci.ps1 共用同一份逻辑
#
# 刻意不重复写编译/测试步骤，而是调用仓库里的 ci.ps1：
# 本地跑的、CI 跑的是同一套流程，不会出现「本地全绿、CI 挂了」。
#
# 注意：路径一律相对「仓库根目录」写死。ci.ps1 会自己定位脚本所在位置，
# 所以不要给 job 设 working-directory，否则相对路径会错位（踩过一次）。
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端编译与测试
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
    env:
      MYSQL_ROOT_PASSWORD: test123456
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest123456"
          --health-interval=10s --health-timeout=5s --health-retries=15

      # RuoYi 强依赖 Redis：Spring 上下文启动时就要连，
      # 缺了它会导致 @SpringBootTest 上下文加载失败、所有用例 error。
      # 测试基类只覆盖了 database 索引，host/port 取 application.yml 的
      # localhost:6379，因此这里必须映射到 runner 本机端口。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 安装 MySQL 客户端
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: 运行 CI 脚本（后端）
        shell: pwsh
    env:
          CAMPUS_DB_USERNAME: root
      CAMPUS_DB_PASSWORD: test123456
        run: ./RuoYi-Vue-master/RuoYi-Vue-master/scripts/ci.ps1 -SkipFrontend -SkipDocker

      - name: 校验接口契约无漂移
        # 启动后端，把实时 OpenAPI 与仓库里的契约快照比对：
        # 加了接口忘了更新快照、或改了路径没同步前端，都会在此失败。
        working-directory: .
        shell: pwsh
    env:
          CAMPUS_DB_USERNAME: root
      CAMPUS_DB_PASSWORD: test123456
          CAMPUS_DB_URL: jdbc:mysql://localhost:3306/shop_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=GMT%2B8
        run: node scripts/export-api-contract.mjs

      - name: 覆盖率门禁（campus 行覆盖 >= 35%）
        # 测试全绿不等于测得够：阈值定在 35%，低于就红，避免"用例越加越水"
        shell: pwsh
        run: ./scripts/check-coverage.ps1 -Minimum 35

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: RuoYi-Vue-master/RuoYi-Vue-master/ruoyi-admin/target/surefire-reports/
          if-no-files-found: ignore

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: RuoYi-Vue-master/RuoYi-Vue-master/ruoyi-admin/target/site/jacoco-aggregate/
          if-no-files-found: ignore

  # =====================================================================
  # 容器编排验证
  #
  # 本机不一定装了 Docker，但 GitHub runner 自带 docker + compose，
  # 所以把「compose 能不能整体跑起来」放到云端验证：
  # 起了 → 打接口 → 查数据 → 收摊。
  #
  # 覆盖的是单测覆盖不到的部分：服务间网络、命名卷权限、
  # MySQL 初始化脚本顺序、Nginx 反向代理。
  # =====================================================================
  compose:
    name: 容器编排验证
    runs-on: ubuntu-latest
    # 这些值只在 runner 内的一次性容器里有效，job 结束即销毁。
    # 必须显式给：docker-compose.yml 的变量是必填语法，缺一个就报错退出
    # （刻意如此 —— 防止默认口令被带上生产）。
    env:
      MYSQL_ROOT_PASSWORD: test123456
      CAMPUS_PAY_SECRET: ci-only-not-a-real-secret
      CAMPUS_DB_PASSWORD: test123456
    steps:
      - uses: actions/checkout@v5

      - name: 校验 compose 文件语法
    env:
          COMPOSE_PROJECT_NAME: campus-trade
        run: docker compose config --quiet && echo "compose 语法正确"

      - name: 构建并启动全部服务
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: 展示服务状态
        run: docker compose ps

      - name: 冒烟测试（经前端 Nginx 反代访问后端）
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:5174/api/v1/products?pageSize=1" -o /tmp/resp.json; then
              echo "服务就绪（第 $((i*5)) 秒）"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "等待超时"; docker compose logs --no-color | tail -120; exit 1
            fi
            sleep 5
          done
          echo "--- 接口响应（前 200 字节）---"
          head -c 200 /tmp/resp.json; echo

      - name: 校验 MySQL 初始化数据已导入
        run: |
          set -e
          count=$(docker compose exec -T mysql mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -B -e "select count(*) from shop.ct_product;" 2>/dev/null)
          echo "ct_product 行数 = $count"
          if [ "$count" -lt 1 ]; then echo "初始化 SQL 未生效"; exit 1; fi

      - name: 校验容器内非 root 用户可写卷（日志与上传目录）
        run: |
          set -e
          docker compose exec -T backend sh -c 'touch /app/logs/_probe && touch /app/uploadPath/_probe && rm -f /app/logs/_probe /app/uploadPath/_probe && echo "卷可写 OK"'

      - name: 收集日志
        if: always()
        run: docker compose logs --no-color | tail -150

      - name: 收摊
        if: always()
        run: docker compose down -v --remove-orphans
  frontend:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 校易淘前端-后端交接-2026-10-19T01-05-57-755Z/package-lock.json

      - name: 运行 CI 脚本（前端）
        shell: pwsh
        run: ./RuoYi-Vue-master/RuoYi-Vue-master/scripts/ci.ps1 -SkipBackend -SkipDocker

      - name: 依赖漏洞门禁（生产依赖 high/critical）
        working-directory: 校易淘前端-后端交接-2026-10-19T01-05-57-755Z
        run: npm audit --omit=dev --audit-level=high

      - name: 构建前端镜像
        run: >
          docker build
          -f "校易淘前端-后端交接-2026-10-19T01-05-57-755Z/Dockerfile"
          -t campus-frontend:${{ github.sha }}
          "校易淘前端-后端交接-2026-10-19T01-05-57-755Z"