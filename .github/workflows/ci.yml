# =====================================================================
# GitHub Actions —— 与 scripts/ci.ps1 共用同一份逻辑
#
# 这里刻意不重复写编译/测试步骤，而是直接调用仓库里的 ci.ps1：
# 本地跑的、CI 跑的是同一套流程，不会出现「本地全绿、CI 挂了」。
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端编译与测试
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test123456
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest123456"
          --health-interval=10s --health-timeout=5s --health-retries=15
    defaults:
      run:
        working-directory: RuoYi-Vue-master/RuoYi-Vue-master
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 安装 MySQL 客户端
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: 运行 CI 脚本（后端）
        shell: pwsh
        env:
          CAMPUS_DB_USERNAME: root
          CAMPUS_DB_PASSWORD: test123456
        run: ./scripts/ci.ps1 -SkipFrontend -SkipDocker

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: RuoYi-Vue-master/RuoYi-Vue-master/ruoyi-admin/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 校易淘前端-后端交接-2026-10-19T01-05-57-755Z
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 校易淘前端-后端交接-2026-10-19T01-05-57-755Z/package-lock.json

      - name: 运行 CI 脚本（前端）
        shell: pwsh
        run: ./RuoYi-Vue-master/RuoYi-Vue-master/scripts/ci.ps1 -SkipBackend -SkipTests -SkipDocker

      - name: 构建前端镜像
        run: docker build -t campus-frontend:${{ github.sha }} .