# 项目相关配置
# 校园二手交易系统自有配置：业务行为开关与凭据注入集中于此。
# 与第三方库配置（如 token、druid）不同，campus.* 只影响本项目代码。
campus:
  # 允许跨域访问的来源：留空表示只允许同源。
  # 开发/演示默认放行 Vite 的 5174；不要用通配符 ——
  # 通配符会让任意站点读取本接口的响应，虽然 Bearer 令牌不易被第三方拿到，
  # 但这属于把防线交给"令牌没泄露"这一假设。
  cors:
    allowed-origins: '${CAMPUS_CORS_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}'
  # 支付回调签名密钥：生产/CI 必须用环境变量覆盖（见 .env.example）
  payment:
    notify-secret: '${CAMPUS_PAY_SECRET:}'
  # 接口限流总开关：测试或压测时可整体关闭
  ratelimit:
    enabled: true
    # 限流计数后端：memory=进程内（单实例）| redis=跨实例共享（多副本必须用这个）
    store: ${CAMPUS_RATELIMIT_STORE:memory}
  # 认证：刷新令牌有效期（天）
  auth:
    refresh-token-days: 7

ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（Windows: D:/ruoyi/uploadPath；Linux: /home/ruoyi/uploadPath）
  # 显式用占位符声明，便于容器里由 RUOYI_PROFILE 覆盖；
  # 否则写死 D:/ 路径在 Linux 容器里会写到奇怪目录，挂载卷失效、图片 404。
  profile: ${RUOYI_PROFILE:D:/ruoyi/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    baseline-description: legacy schema imported from sql/*.sql
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

  # 定时任务：调度状态落库 + 集群模式
  # 多实例靠 QRTZ_LOCKS 行锁保证同一时刻只有一个节点触发同一个任务
  quartz:
    job-store-type: jdbc
    jdbc:
      # 表由 Flyway 管理（V3__quartz_cluster_tables.sql）
      # 绝不能让 Spring 每次启动重建：会 DROP 掉调度状态与锁表，集群立即失效
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.scheduler.instanceName: campus-scheduler
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.jobStore.acquireTriggersWithinLock: true
      org.quartz.jobStore.misfireThreshold: 12000
      org.quartz.threadPool.threadCount: 20

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  # 默认值仅供本地开发；部署时必须用 CAMPUS_JWT_SECRET 覆盖。
  # 用默认值上线等于把签发权公开：仓库里能看到密钥的人可以伪造任意用户令牌。
  secret: ${CAMPUS_JWT_SECRET:abcdefghijklmnopqrstuvwxyz}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
# enabled 走环境变量：接口文档默认开放（便于联调与演示），
# 但生产环境应当把 SPRINGDOC_ENABLED 设为 false——否则
# /v3/api-docs 与 /swagger-ui.html 会把全部接口结构公开给互联网。
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 指标与健康检查（Prometheus 抓取 /actuator/prometheus）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: campus-shop
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true