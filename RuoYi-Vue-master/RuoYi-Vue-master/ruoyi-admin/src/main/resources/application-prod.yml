# 生产环境覆盖配置。
# 启动方式：SPRING_PROFILES_ACTIVE=druid,prod
#   - druid：数据源配置（application-druid.yml）
#   - prod ：本文件的强约束
#
# 这里刻意把「生产不安全」的默认值全部收掉，并由 ProductionGuard 在启动时
# 对仍为开发默认值的关键项直接失败，避免带着默认密钥/沙箱支付上线。

campus:
  # 生产隐藏内置演示账号提示（前端登录框那句“演示账号 …”）
  demo-mode: ${CAMPUS_DEMO_MODE:false}
  cors:
    # 生产必须显式声明前端域名，留空表示只允许同源。
    # 不允许通配符，也不允许把 localhost 带进来。
    allowed-origins: '${CAMPUS_CORS_ORIGINS:}'
  payment:
    # 支付方式：4=线下面交（OfflinePaymentGateway）。
    # 接入真实网关后改成 1(支付宝)/2(微信)。
    method: ${CAMPUS_PAY_METHOD:4}
    notify-secret: '${CAMPUS_PAY_SECRET:}'
  order:
    timeout-minutes: ${CAMPUS_ORDER_TIMEOUT_MINUTES:30}
  product:
    audit-enabled: true
  ratelimit:
    enabled: true
    # 多副本必须用 redis，保证限流计数跨实例一致
    store: ${CAMPUS_RATELIMIT_STORE:redis}
  auth:
    register-enabled: ${CAMPUS_REGISTER_ENABLED:true}
  sms:
    # 生产开启短信验证码；开启后注册必须带 smsCode
    enabled: ${CAMPUS_SMS_ENABLED:true}
    provider: ${CAMPUS_SMS_PROVIDER:tencent}
    code-ttl-seconds: ${CAMPUS_SMS_CODE_TTL:300}
    send-interval-seconds: ${CAMPUS_SMS_INTERVAL:60}
    daily-limit: ${CAMPUS_SMS_DAILY_LIMIT:10}
    tencent:
      secret-id: '${TENCENT_SMS_SECRET_ID:}'
      secret-key: '${TENCENT_SMS_SECRET_KEY:}'
      sdk-app-id: '${TENCENT_SMS_SDK_APP_ID:}'
      sign-name: '${TENCENT_SMS_SIGN_NAME:}'
      template-id: '${TENCENT_SMS_TEMPLATE_ID:}'
      region: '${TENCENT_SMS_REGION:ap-guangzhou}'
  storage:
    type: ${CAMPUS_STORAGE_TYPE:cos}
    cos:
      secret-id: '${TENCENT_COS_SECRET_ID:}'
      secret-key: '${TENCENT_COS_SECRET_KEY:}'
      bucket: '${TENCENT_COS_BUCKET:}'
      region: '${TENCENT_COS_REGION:ap-guangzhou}'
      # 对外访问域名，例如 https://cdn.example.com；留空则用 bucket 默认域名
      public-base-url: '${TENCENT_COS_PUBLIC_BASE_URL:}'
      key-prefix: '${TENCENT_COS_KEY_PREFIX:upload}'

# 生产关闭接口文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  devtools:
    restart:
      enabled: false

logging:
  level:
    com.ruoyi: info
  file:
    name: ${CAMPUS_LOG_FILE:logs/campus.log}
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# 生产健康检查不暴露细节
management:
  endpoint:
    health:
      show-details: never
