# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: ${CAMPUS_DB_URL:jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&useSSL=true&serverTimezone=GMT%2B8}
                username: ${CAMPUS_DB_USERNAME:root}
                # 凭据只从环境变量注入，不设默认值：缺失即启动失败，避免默认口令被带上生产
                # 本地开发在仓库根放 .env（已 gitignore），启动脚本会自动加载
                password: '${CAMPUS_DB_PASSWORD}'
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: 
                username: 
                password: 
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: true
            statViewServlet:
                # 默认关闭。Druid 控制台会暴露数据源地址、账号与 SQL 统计，
                # 默认开启等于给扫描器一个现成的入口（/druid/datasource.json）。
                # 需要看监控时显式开启：CAMPUS_DRUID_ENABLED=true 再重启。
                enabled: '${CAMPUS_DRUID_ENABLED:false}'
                # 开启后仍默认只允许本机；确需远程访问用 CAMPUS_DRUID_ALLOW 追加具体 IP。
                allow: '${CAMPUS_DRUID_ALLOW:127.0.0.1,::1}'
                url-pattern: /druid/*
                # 控制台账号同样不设默认值；未配置则不启用登录（生产建议直接关闭）
                login-username: '${CAMPUS_DRUID_USERNAME:}'
                login-password: '${CAMPUS_DRUID_PASSWORD:}'
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true