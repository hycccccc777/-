# =====================================================================
# 校园二手交易系统 · 一键启动全部依赖
#   docker compose up -d --build
#   前端 http://localhost:5174   后端 http://localhost:8080
# 首次启动 MySQL 会自动执行 sql/ 目录下的建表与演示数据脚本。
# =====================================================================

# 显式声明项目名。
#
# Compose 默认用「当前目录名」当项目名，但项目名必须以字母或数字开头、
# 只能含小写字母数字与 -_。而本项目实际目录名往往是「校园二手」（含中文，
# 会被清空）或 CI runner 上的「-」（非法首字符），两种情况都会让
# docker compose 直接报错退出。写死后在任何目录下、任何机器上行为一致。
name: campus-trade

services:

  mysql:
    image: mysql:8.4
    container_name: campus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?compose 需要 MYSQL_ROOT_PASSWORD（见 .env.example）}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shop}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 只读挂载 SQL 目录，容器内由引导脚本按正确顺序 source
      - ./RuoYi-Vue-master/RuoYi-Vue-master/sql:/scripts:ro
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?compose 需要 MYSQL_ROOT_PASSWORD（见 .env.example）}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: campus-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./RuoYi-Vue-master/RuoYi-Vue-master
      dockerfile: Dockerfile
    image: campus-backend:latest
    container_name: campus-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-shop}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: root
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:?compose 需要 MYSQL_ROOT_PASSWORD（见 .env.example）}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # 支付回调签名密钥，只从环境注入，不写进代码或镜像。
      # 变量名必须与程序读取的键一致（application.yml: campus.payment.notify-secret -> CAMPUS_PAY_SECRET），
      # 否则容器里读到空值，回调验签形同虚设。
      CAMPUS_PAY_SECRET: ${CAMPUS_PAY_SECRET:?compose 需要 CAMPUS_PAY_SECRET（随机值）}
      # JWT 签名密钥，同样必须覆盖。不传则回落到仓库里的开发默认值，
      # 等于把令牌签发权公开，任何人可伪造任意用户。
      CAMPUS_JWT_SECRET: ${CAMPUS_JWT_SECRET:?compose 需要 CAMPUS_JWT_SECRET（随机长串）}
      # 上传目录：键名是 RUOYI_PROFILE（对应 ruoyi.profile）。
      # 少写一个 O 就覆盖不到，容器会往 D:/ruoyi/uploadPath 这种路径写，挂的卷白挂。
      RUOYI_PROFILE: ${UPLOAD_DIR:-/app/uploadPath}
      # 日志目录同样可移植，默认落到容器内 /app/logs
      LOG_PATH: /app/logs
      # 生产：设为 druid,prod 启用生产自检（默认 druid，本地/CI 保持原行为）
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-druid}
      # 前端域名白名单、支付方式、短信与对象存储（详见 .env.example）
      CAMPUS_CORS_ORIGINS: ${CAMPUS_CORS_ORIGINS:-}
      CAMPUS_PAY_METHOD: ${CAMPUS_PAY_METHOD:-4}
      # 首次上线自动把 admin 默认密码改为该值（仅当 admin 仍是默认密码时生效）
      CAMPUS_ADMIN_PASSWORD: ${CAMPUS_ADMIN_PASSWORD:-}
      CAMPUS_ADMIN_FORCE_RESET: ${CAMPUS_ADMIN_FORCE_RESET:-false}
      CAMPUS_SMS_ENABLED: ${CAMPUS_SMS_ENABLED:-false}
      CAMPUS_SMS_PROVIDER: ${CAMPUS_SMS_PROVIDER:-log}
      TENCENT_SMS_SECRET_ID: ${TENCENT_SMS_SECRET_ID:-}
      TENCENT_SMS_SECRET_KEY: ${TENCENT_SMS_SECRET_KEY:-}
      TENCENT_SMS_SDK_APP_ID: ${TENCENT_SMS_SDK_APP_ID:-}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME:-}
      TENCENT_SMS_TEMPLATE_ID: ${TENCENT_SMS_TEMPLATE_ID:-}
      TENCENT_SMS_REGION: ${TENCENT_SMS_REGION:-ap-guangzhou}
      CAMPUS_STORAGE_TYPE: ${CAMPUS_STORAGE_TYPE:-local}
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID:-}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY:-}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:-}
      TENCENT_COS_REGION: ${TENCENT_COS_REGION:-ap-guangzhou}
      TENCENT_COS_PUBLIC_BASE_URL: ${TENCENT_COS_PUBLIC_BASE_URL:-}
      TENCENT_COS_KEY_PREFIX: ${TENCENT_COS_KEY_PREFIX:-upload}
    volumes:
      - upload-data:/app/uploadPath
      - backend-logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./校易淘前端-后端交接-2026-10-19T01-05-57-755Z
      dockerfile: Dockerfile
    image: campus-frontend:latest
    container_name: campus-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5174}:80"

volumes:
  backend-logs:
  mysql-data:
  redis-data:
  upload-data: