# 后端负载均衡（Nginx）
#
# 为什么用 Nginx 而不是 Spring Cloud Gateway：只有「分流 + 探活 + 透传」三个需求，
# Nginx 几十行配置就够，运维熟、资源占用低；引网关框架要多维护一套服务与注册中心。
#
# 关键点：
#   1. 后端必须无状态（JWT + Redis 存会话），否则分流会导致随机掉登录 ——
#      这就是前面「令牌落 Redis、定时任务进 JDBC JobStore」两件事的收益
#   2. max_fails/fail_timeout 让坏节点被自动摘除；健康节点恢复后自动回池
#   3. keepalive 复用到后端的长连接，避免每次请求三次握手
#   4. 透传真实客户端 IP，否则限流会把所有人当成 127.0.0.1 而互相连坐

upstream campus_backend {
    # least_conn 比轮询更稳：慢请求不会把队列堆在同一节点
    least_conn;

    server backend-1:8080 max_fails=2 fail_timeout=15s;
    server backend-2:8080 max_fails=2 fail_timeout=15s;

    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 客户端真实 IP：后端限流按 IP 计数，缺失会让所有人共享一份配额
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    client_max_body_size 20m;

    # 健康检查走单节点，避免探活请求也参与轮询
    location = /lb/health {
        proxy_pass http://backend-1:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # 看当前哪些节点在池子里（调试用，生产可关）
    location = /lb/status {
        access_log off;
        default_type text/plain;
        return 200 "upstream campus_backend -> backend-1:8080, backend-2:8080\n";
    }

    location /api/ {
        proxy_pass http://campus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传 traceId：链路在网关这层就断掉的话，后面所有日志都对不上
        proxy_set_header X-Trace-Id        $http_x_trace_id;

        proxy_connect_timeout 3s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # 幂等读请求允许重试到另一个节点；POST 不重试（可能已产生副作用）
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /actuator/ {
        proxy_pass http://campus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /druid/ {
        proxy_pass http://campus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}