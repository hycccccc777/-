# 后端负载均衡 + 灰度发布（Nginx）
#
# 为什么用 Nginx 而不是 Spring Cloud Gateway：只有「分流 + 探活 + 灰度 + 透传」
# 四个需求，Nginx 几十行配置就够，运维熟、占用低；引网关要多维护一套服务与注册中心。
#
# 五个关键点（每条都是踩过或见过的坑）：
#   1) 后端必须无状态（JWT + Redis 存会话），否则分流会随机掉登录
#   2) max_fails/fail_timeout 让坏节点自动摘除，恢复后自动回池
#   3) keepalive 复用到后端的长连接，避免每次请求三次握手
#   4) 透传真实客户端 IP，否则限流把所有人算成同一个 IP 而互相连坐
#   5) 灰度只放读流量：写接口钉在稳定池，避免「写在新版、读在旧版」的数据错乱

# ---------------------------------------------------------------------------
# 稳定池：读流量按权重分配（灰度期把 canary 的 weight 从 0 调到 1 再逐步加）
# ip_hash 保证同一用户落在同一侧：刷新页面不会在两套逻辑之间跳
# ---------------------------------------------------------------------------
upstream campus_backend {
    ip_hash;

    server backend-1:8080      weight=9 max_fails=2 fail_timeout=15s;
    server backend-2:8080      weight=9 max_fails=2 fail_timeout=15s;
    # 灰度节点：0 = 关闭灰度（秒级生效，不必回滚镜像）
    #          1 = 约 5%（1/(9+9+1)）
    #          9 = 约 33%
    #          直接下线该行 = 100% 切到新版本
    server backend-canary:8080 weight=1 max_fails=2 fail_timeout=15s;

    keepalive 32;
}

# ---------------------------------------------------------------------------
# 只含稳定节点的池：写接口与探针走这里，永不进灰度
# ---------------------------------------------------------------------------
upstream campus_backend_stable {
    least_conn;
    server backend-1:8080 weight=1 max_fails=2 fail_timeout=15s;
    server backend-2:8080 weight=1 max_fails=2 fail_timeout=15s;
    keepalive 32;
}

# 灰度分组自述（写进响应头与日志，便于对账）
split_clients "${remote_addr}" $canary_cohort {
    10%     "canary";
    *       "stable";
}

server {
    listen 80;
    server_name _;

    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    client_max_body_size 20m;

    # 探针走稳定池单节点，不参与灰度
    location = /lb/health {
        proxy_pass http://backend-1:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # 灰度状态（调试用；生产可关）
    location = /lb/status {
        access_log off;
        default_type text/plain;
        return 200 "cohort=$canary_cohort  upstream=campus_backend(9:9:1)\n";
    }

    # ---- 写接口：钉在稳定池，永不进灰度 ----
    # 用正则一次匹配交易类写接口；其余接口（浏览、搜索）允许灰度
    location ~ ^/api/v1/(orders|pay|refunds?|cart)(/|$) {
        proxy_pass http://campus_backend_stable;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }

    # ---- 读接口：走带灰度的池 ----
    location /api/ {
        proxy_pass http://campus_backend;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }

    location /actuator/ {
        proxy_pass http://campus_backend_stable;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /druid/ {
        proxy_pass http://campus_backend_stable;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}